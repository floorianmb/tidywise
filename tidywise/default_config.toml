# Defaults for Tidywise. Your own settings live in ~/.config/tidywise/config.toml
# and are created during setup in the app (or with `tidywise config init`).

# Where files are sorted to. Topics/, Links/, Days/, _inbox/ and AGENTS.md are created here.
root = "~/Downloads/Tidywise"

# Where Tidywise looks. Only loose files directly in these folders – subfolders are never touched.
watch = ["~/Downloads", "~/Documents", "~/Desktop"]

# Leave a file alone until it has been unchanged for this many minutes.
min_age_minutes = 60
# false: suggestions only, you confirm. true: confident cases are moved automatically.
auto_apply = false
# Below this confidence (0–1) a file goes to _inbox/ instead of a topic.
min_confidence = 0.6
# Subfolders inside a topic: "none", "year" or "month".
subfolders = "none"
# How often the app checks while it is open (minutes).
interval_minutes = 15
skip_extensions = [".crdownload", ".download", ".part", ".partial", ".tmp", ".icloud", ".ds_store", ".localized"]

# The local AI model (name as in `ollama pull`) and the address of Ollama.
model = "gemma4:e4b-it-qat"
ollama_url = "http://127.0.0.1:11434"
# "ollama", or "openai" for another local server with an OpenAI-style API: LM Studio (http://127.0.0.1:1234/v1),
# mlx-lm's `mlx_lm.server` or llama.cpp's `llama-server` (http://127.0.0.1:8080/v1). Then `model` is the name
# that server uses.
llm_backend = "ollama"
llm_url = "http://127.0.0.1:1234/v1"
# Only true lets Tidywise send file contents to a model server on another computer.
allow_remote_llm = false
# A sentence about you helps the model sort.
profile = ""
# The language summaries and keywords are written in – best the one you search in.
summary_language = "English"

# Read the Chrome history as a link collection. Off by default – you turn it on deliberately during setup.
links_enabled = false
chrome_profile = "Default"
links_first_days = 14
links_interval_minutes = 60

# Let AI assistants (Claude Code, Codex, OpenCode, …) search the archive through `tidywise mcp`.
# Read-only, and only while the Tidywise app is open. Off until you connect an assistant.
mcp_enabled = false

# Topics. slug = folder name. The model reads the description – the more specific, the better.
